description: >-
  Machine-readable plans and pricing for OpenMercantil. Four tiers are
  published: a genuinely usable Free tier (anonymous public API, 60 req/min and
  200 req/day per IP, no key), Profesional at 57 EUR/month, MAX at 197 EUR/month
  (both excluding Spanish VAT, both with a 14-day trial and a 5% annual
  discount), and a negotiated Enterprise tier. The provider's stated position is
  that BORME data is public by legal mandate and its job is to structure it, not
  monetise it — paid tiers fund infrastructure and unlock capacity, exports,
  alerts and API quota rather than gating the underlying records.
notes: >-
  Supersedes the 2026-05-16 scaffold, which flagged the per-tier API quotas as
  unreconciled placeholders. Those quotas are now published in two agreeing
  places — the rate-limit table on the API reference and info.x-rate-limit
  inside the OpenAPI 3.1 contract — and are recorded exactly. Annual pricing is
  presented on the page only as a monthly equivalent after a 5% discount
  (54 EUR/mo Profesional, 187 EUR/mo MAX); the annual charge total is rendered
  client-side and is not in the served HTML, so it is recorded as derived from
  the published monthly equivalent rather than quoted.
plan_count: 4
currency: EUR
tax_note: >-
  All listed prices exclude VAT. Spanish VAT (21%) is added at checkout;
  businesses with a valid intra-community VAT number are invoiced under the
  reverse-charge mechanism. Example given on the page: 57 EUR + 21% = 68.97 EUR.

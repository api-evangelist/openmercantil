    path: /api/v1/donation
  - name: Credits
    type: credits
    operationId: postCreditsCheckout
    path: /api/v1/credits/checkout
    used_for: >-
      Paid legal reports (createCompanyLegalReport returns 402
      insufficient_credits with cost, balance and a buy_url when short).
promo_codes_supported: true
payment_processor: Stripe (Checkout + Customer Portal)
cancellation: Cancel any time; no commitment on monthly billing.
free_alternative: >-

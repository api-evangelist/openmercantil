- name: bearerAuth
  type: http
  scheme: bearer
  bearerFormat: opaque omk_* credential
  description: 'Optional Authorization: Bearer transport for the same opaque omk_* API credential accepted
    by X-API-Key. It is not a JWT or OAuth access token.'
  sources:

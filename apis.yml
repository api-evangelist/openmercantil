description: OpenMercantil is an independent public-data API for Spanish company intelligence. It indexes the Boletin
  Oficial del Registro Mercantil (BORME) and cross-references it with 80+ official public sources (BOE, CNMV, CNMC,
  AEAT, AEPD, PLACSP, TED EU, BDNS, OEPM, EPO, WIPO, CENDOJ, GLEIF, OpenSanctions, ICIJ and more) to expose company
  and person search, structured company reports, BORME registry event timelines, documentary officer mentions, CNAE
  sector navigation and ratios, daily BORME summaries, public-procurement notices and rankings, documentary risk
  signals, a corporate relationship graph, a Spanish mercantile-law corpus that bridges registry acts to the governing
  BOE norm, account-plane datasets and HMAC-signed outbound webhooks, and CSV/JSON bulk exports. The live OpenAPI
  3.1 contract (v1.9.3) declares 118 paths and 139 operations. The public read plane is free and anonymous with
  no API key, rate-limited at 60 req/min and 200 req/day per IP, with paid Profesional, MAX and Enterprise tiers
  raising the quota. Derived data is CC BY 4.0 and every response carries its own source and attribution metadata.
  The project is informational and does not replace official Registro Mercantil certificates.

  description: 'Spanish mercantile-law layer (derecho mercantil): legislation corpus + article texts + act→norm
    bridge. Distributes the consolidated BOE legal corpus structured by OpenMercantil so LLMs and agents can cite
    it as a source. License: consolidated text from the BOE, reused under Ley 37/2007 (re-use of public sector information);

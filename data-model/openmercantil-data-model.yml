description: >-
  Entity-relationship graph for the OpenMercantil public data model, derived
  from the $ref edges and *_slug id-reference fields in the live OpenAPI 3.1
  contract. The model has one gravitational centre — the company, keyed by a
  slug of the form {name}-{cif} — and everything else hangs off it: BORME
  registry acts, documentary officer mentions, procurement notices, grants,
  sanctions, sector aggregates and the mercantile-law corpus.
identity:
  primary_key: slug
  slug_form: '{normalized-name}-{cif}'
  slug_examples:
    - inditex-sa-a15075062
    - mercadona-sa-a46103834
  natural_key: CIF/NIF (Spanish tax identifier)
  person_key: person slug (documentary mention identifier — never a DNI/NIE)
  resolution_contract:
    name: x-company-identity-contract
    version: '1.0'
    projection: company_public_v2 (immutable, generation-bound corporate sidecar)
    states:
      published: canonical corporate slug admitted
      safe_alias: canonicalized server-side; canonical URL returned in Content-Location
      withheld: >-
        neutral 404 — covers absent, natural-person, and ambiguous or
        quarantined identities alike, so a 404 is NOT proof of non-existence
      unavailable: 503 with no-store; clients must not infer absence
    note: >-
      This preflight runs on every /api/v1/company/{slug}*, /api/v1/empresa/
      {slug}* and /api/v1/grafo/{slug} read before any report, cache, graph or
      dataset lookup, and MCP company tools inherit it through REST.
core_entities:
  - name: Company
    schema: CompanyIdentity
    key: slug
    description: >-
      The central entity. Registry identity plus derived KPIs. Exposed through
      CompanyReport, which composes identity, events, officers and summary.
    exposed_by:
      - getCompanyBySlug
      - getEmpresaBySlugFacts
      - compareCompanies

  - name: CompanyReport
    schema: CompanyReport
    description: >-
      The composed company document. Notably carries its own provenance:
      `_data_sources_used`, `_attributions` and `_source_catalog` travel with
      the payload, so a consumer can tell which upstream sources and licences
      apply to the record it just received.
  - name: BormeEvent
    schema: BormeEvent
    description: >-
      A single registry act published in the BORME. Retains the official
      BORME-A-YYYY-NNN-NN identifier and a source_url to the BOE PDF.
    key_fields: [id, date, publish_date, type, act_type, title, province, source, source_url]
  - name: OfficerDocumentaryMention
    schema: OfficerDocumentaryMention
    description: >-
      A documentary mention of a natural person in an officer role — explicitly
      not a profile. Links to a person slug, never a DNI/NIE.
  - name: PersonDocumentaryReport
    schema: PersonDocumentaryReport
    description: >-
      Person-side view, split into active_positions and inactive_positions.
      Carries projection metadata and the same provenance sidecar.
  - name: TenderNotice
    schema: TenderNotice
    description: >-
      A PLACSP public procurement notice with typed monetary amounts, a buyer
      party and (where awarded) a supplier party. Only legal persons are
      exposed as suppliers, for GDPR reasons.
  - name: LegalNormFull
    schema: LegalNormFull
    description: >-
      A Spanish mercantile-law norm from the consolidated BOE corpus, with key
      articles, the BORME act types it regulates, and a citable fact.
  - name: CnaeNode
    schema: CnaeNode
    description: A node in the CNAE sector taxonomy tree.
  - name: PublicSourceMetadata
    schema: PublicSourceMetadata
    description: >-
      An entry in the versioned public-source catalog — the licensing spine of
      the whole model.

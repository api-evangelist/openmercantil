description: >-
  OpenMercantil announces a Model Context Protocol server — "37 tools, 3
  resources, 4 prompts over OpenAPI 1.9.3", GET-only, with double RGPD
  redaction — on a dedicated product page at https://openmercantil.es/mcp. The
  server is NOT publicly reachable. The page states in the provider's own
  words: "Servidor MCP construido · en despliegue controlado" (built, in
  controlled rollout) and invites interested parties to write in for early
  access. A live JSON-RPC probe confirms the endpoint is not serving MCP.
notes: >-
  POST https://openmercantil.es/mcp with a well-formed
  {"jsonrpc":"2.0","id":1,"method":"tools/list"} body and
  Accept: application/json, text/event-stream returns HTTP 200 with
  content-type text/html — the marketing landing page, not a JSON-RPC
  response. The same is true of an `initialize` call. This is exactly the
  soft-200 false positive the pipeline warns about: a 200 here is NOT
  evidence of an agent surface. NO `MCPServer` pointer is emitted in apis.yml,
  because emitting one would credit OpenMercantil with a callable agent
  surface that no agent can currently call. Re-probe on the next pass; the
  provider says the package is built, so this is likely to flip to a real
  remote endpoint.

              $ref: '#/components/schemas/TenderMoney'
            budget_tax_exclusive:
              $ref: '#/components/schemas/TenderMoney'
            estimated_total:
              $ref: '#/components/schemas/TenderMoney'
            award_payable_total:
              $ref: '#/components/schemas/TenderMoney'
        reported_amount_eur:
          type:
          - number
          - 'null'
          deprecated: true
          description: 'Compatibility field: award_payable_total only when its currency is EUR. Not proof
            of payment/executed spend.'
        reported_tax_exclusive_amount_eur:
          type:
          - number
          - 'null'
          deprecated: true
        amount_quality:
          type: string
          description: Projection quality marker such as complete, separated_reported, missing, legacy_withheld
            or outlier_withheld.
        amount_semantics:
          type: string
        phase:
          type:
          - string
          - 'null'
          enum:
          - PUB
          - PRE
          - EV
          - ADJ
          - RES
          - ANUL
          - null
        phase_description:
          type:
          - string
          - 'null'
        published_at:
          type:
          - string
          - 'null'
          format: date
        awarded_at:
          type:
          - string
          - 'null'
          format: date
        formalised_at:
          type:
          - string
          - 'null'
          format: date
        submission_deadline:
          type:
          - string
          - 'null'
          format: date
        is_open:
          type: boolean
        province:
          type:
          - string
          - 'null'
        province_slug:
          type:
          - string
          - 'null'
        document_count:
          type: integer
          minimum: 0
        lot_count:
          type: integer
          minimum: 0
        result_count:
          type: integer
          minimum: 0
        supplier_count:
          type: integer
          minimum: 0
        official_url:
          type:
          - string
          - 'null'
          format: uri
        parser_version:
          type:
          - string
          - 'null'
        source:
          type: string
          const: PLACSP
    TenderParty:
      type: object
      additionalProperties: false
      properties:
        name:
          type:
          - string
          - 'null'
        cif:
          type:
          - string
          - 'null'
          description: Corporate CIF only.
        nif:
          type:
          - string
          - 'null'
          description: Public-body NIF; never a supplier DNI/NIE.
        dir3:
          type:
          - string
          - 'null'
        company_slug:
          type:
          - string
          - 'null'
        withheld:
          type: boolean
    WikidataCompanyRecord:
      type: object
      description: Structured CC0 subset only; no label, logo, website, CEO, LEI, Wikipedia text or media.
      required:
      - qid
      - entity_url
      - ticker
      - inception
      properties:
        qid:
          type: string
          pattern: ^Q[1-9][0-9]*$
        entity_url:
          type: string
          format: uri
          pattern: ^https://www\.wikidata\.org/entity/Q[1-9][0-9]*$
        ticker:
          type:
          - string
          - 'null'
        inception:
          type:
          - string
          - 'null'
          format: date
      additionalProperties: false
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Optional opaque omk_* API credential for public GETs. Anonymous access remains valid;
        a credential with the operation's x-api-credential-scope (or public:read) selects its account
        quota. Never place credentials in query strings.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque omk_* credential
      description: 'Optional Authorization: Bearer transport for the same opaque omk_* API credential
        accepted by X-API-Key. It is not a JWT or OAuth access token.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: ob_sess
      description: Browser session cookie set after login at /mi-cuenta/login. Mutations also require
        X-CSRF-Token header (obtain via GET /api/v1/user/me).

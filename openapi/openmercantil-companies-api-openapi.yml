          - string
          - 'null'
        count:
          type: integer
          minimum: 0
        al_dia:
          type: boolean
        last_year:
          type:
          - integer
          - 'null'
        last_deposit_date:
          type:
          - string
          - 'null'
        has_financials:
          type: boolean
        years:

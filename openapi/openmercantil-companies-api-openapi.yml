          - string
          - 'null'
        text_value:
          type:
          - string
          - 'null'
        person_name:
          type:
          - string
          - 'null'
        role:
          type:
          - string
          - 'null'
        source_url:
          type:
          - string
          - 'null'
          format: uri
      additionalProperties:
        $ref: '#/components/schemas/JsonValue'
    CnmvEventRecord:
      type: object
      required:
      - date
      - type
      - title
      - notice_url
      properties:
        date:
          type: string
          format: date
        type:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: string
          minLength: 1

    CompanyIntegrationAcquisitionCoverage:
      type: object
      description: Attested acquisition boundary for one governed source package. Completeness applies
        only to this exact bounded scope; complete_history_claimed and source_snapshot_claimed are always
        false, so this metadata never asserts complete historical or upstream snapshot coverage.
      required:
      - scope
      - declared_scope_complete
      - complete_history_claimed
      - source_snapshot_claimed
      - window_start
      - window_end
      - relative_window_days
      - source_as_of
      - identity_seed_subject_count
      - request_count
      - partition_count
      - source_package_schema
      - source_package_manifest_sha256
      - source_fragment_schema
      - source_fragment_sha256
      - source_authority_binding_sha256
      - coverage_sha256
      properties:
        scope:
          type: string
          enum:
          - bounded_newest_first_page_prefix
          - directory_snapshot_plus_relative_event_window
          - publication_date_window_page_walk
          - exact_identity_seed_lookup_snapshot
        declared_scope_complete:
          type: boolean
          const: true
          description: All partitions declared by this bounded acquisition scope were captured; this is
            not a complete-history claim.
        complete_history_claimed:
          type: boolean
          const: false
        source_snapshot_claimed:
          type: boolean
          const: false
        window_start:
          type:
          - string
          - 'null'
          format: date
        window_end:
          type:
          - string
          - 'null'
          format: date
        relative_window_days:
          type:
          - integer
          - 'null'
          minimum: 1
        source_as_of:
          type:
          - string
          - 'null'
          format: date
        identity_seed_subject_count:
          type: integer
          minimum: 1
        request_count:
          type: integer
          minimum: 1
        partition_count:
          type: integer
          minimum: 1
        source_package_schema:
          type: string
          enum:
          - openmercantil-bdns-reingest-package/v2
          - openmercantil-cnmv-reingest-package/v2
          - openmercantil-ted-reingest-package/v2
          - openmercantil-wikidata-reingest-package/v2
        source_package_manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        source_fragment_schema:
          type: string
          enum:
          - openmercantil-bdns-reingest-source-fragment/v2
          - openmercantil-cnmv-reingest-source-fragment/v2
          - openmercantil-ted-reingest-source-fragment/v2
          - openmercantil-wikidata-reingest-source-fragment/v2
        source_fragment_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        source_authority_binding_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        coverage_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Digest of the producer-declared bounded coverage object; it is integrity evidence,
            not proof of complete history.
      additionalProperties: false

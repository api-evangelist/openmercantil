    UserSegmentFilters:
      type: object
      minProperties: 1
      description: 'Corporate-only filters executed exclusively over the immutable company_public_v2 sidecar. At least one effective anchor is required: provincia, cnae_prefix, a capital bound, a year bound or recent_days. `forma` and `estado` are deliberately not accepted; stored legacy filters containing either fail closed. Without provincia/cnae_prefix, capital and temporal anchors cannot be combined; capital-only anchors accept only capital_desc/capital_asc (or the default), and temporal-only anchors accept only recent/oldest (or the default).'
      x-effective-filter-fields:
      - provincia
      - cnae_prefix
      - capital_min
      - capital_max
      - year_min
      - year_max
      - recent_days
      x-rejected-fields:
        forma: legal_form_filter_unavailable
        estado: status_filter_unavailable
      x-rejected-combinations:
      - when: capital bound plus temporal bound without provincia or cnae_prefix
        error: unsupported_filter_combination
        status: 422
      - when: capital-only anchor with sort other than capital_desc or capital_asc
        error: unsupported_sort_for_anchor
        status: 422
      - when: temporal-only anchor with sort other than recent or oldest
        error: unsupported_sort_for_anchor
        status: 422
      properties:
        provincia:
          type: string
          minLength: 1
          maxLength: 80
          description: Canonical Spanish province name or supported alias; matched exactly after normalization.
        cnae_prefix:
          type: string
          pattern: ^[0-9]{1,4}$
        capital_min:
          type: integer
          minimum: 0
          maximum: 90000000000000
          description: Euros. Must not exceed capital_max when both are present.
        capital_max:
          type: integer
          minimum: 0
          maximum: 90000000000000
          description: Euros. Must be greater than or equal to capital_min when both are present.
        year_min:
          type: integer
          minimum: 1800
          maximum: 2200
          description: Inclusive year of the first documentary record; must not exceed year_max.
        year_max:
          type: integer
          minimum: 1800
          maximum: 2200
          description: Inclusive year of the first documentary record; must be greater than or equal to year_min.
        recent_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: First documentary record within this rolling number of days.
        sort:
          type: string
          enum:
          - capital_desc
          - capital_asc
          - acts_desc
          - oldest
          - recent
          description: Indexed ordering. The accepted value depends on the effective anchor as documented in x-rejected-combinations.
      additionalProperties: false

shared_rules:
  - >-
    A 404 on a company or person slug is NEUTRAL — it covers absent,
    natural-person, ambiguous and quarantined identities alike. Never report it
    as proof of non-existence.
  - >-
    A 503 projection error means UNKNOWN, never empty. Do not cache it, do not
    assert absence, do not report an unchecked source as clean.
  - >-
    Never construct a company slug. Resolve it through getSearch by exact CIF or
    canonical name.
  - >-
    Free tier is 60 req/min and 200 req/day per IP. Honour Retry-After on 429
    and prefer the CC BY 4.0 bulk datasets at /descargas over looping.
  - >-
    Send If-None-Match with a prior ETag; 304 responses are common and free.
  - >-
    Attribute per X-Data-Sources and X-Attribution-Required. Own derived data is
    CC BY 4.0; upstream source terms prevail.
  - >-
    Natural persons are documentary mentions only. No DNI/NIE, addresses, phones
    or emails are exposed, and a mention implies neither control nor wrongdoing.
  - >-
    OpenMercantil is not an official source and performs no credit scoring. For
    legal effect, direct users to the BOE or the competent Registro Mercantil.

description: >-
  Versioning, deprecation, status and support lifecycle for the OpenMercantil
  v1 REST API. Versioning is URI-path (`/api/v1`) with the contract itself
  carrying a semantic version (1.9.3). Deprecation is expressed IN the contract
  — 14 operations are flagged `deprecated: true`, most with an `x-replaced-by`
  pointer at the successor path — rather than in a separate prose policy.
versioning:
  style: uri-path
  current_major: v1
  path_prefix: /api/v1
  contract_version: 1.9.3
  contract_url: https://openmercantil.es/openapi.json
  documented_versions:
    - v1.0
    - v1.1
    - v1.2
    - v1.4
  note: >-
    The published changelog on the API reference stops at v1.4 (2026-05-05)
    while the live OpenAPI document declares 1.9.3 — the contract is
    substantially ahead of the human-readable changelog. Recorded as observed,
    not corrected.
  breaking_change_policy: >-
    Superseded routes are kept live and marked deprecated in the contract with
    an x-replaced-by successor pointer, rather than being removed. No removal
    date is published for any deprecated route.
deprecation:
  policy_published: true
  policy_location: OpenAPI contract (deprecated + x-replaced-by), not a standalone prose page
